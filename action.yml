name: "ls-exit Lemon Squeezy Migration Scanner"
description: "Scan repositories for Lemon Squeezy APIs, webhooks, SDKs, checkout links, and license keys ahead of the March 31, 2027 shutdown."
author: "Aykut Mayali"
branding:
  icon: "alert-triangle"
  color: "yellow"

inputs:
  path:
    description: "Directory path to scan"
    required: false
    default: "."
  target:
    description: "Target Merchant of Record for tailored migration hints (polar | paddle | creem | dodo | generic)"
    required: false
    default: "generic"
  format:
    description: "Report format (markdown | json | both)"
    required: false
    default: "markdown"
  out:
    description: "Optional output report file path"
    required: false
    default: "ls-exit-report.md"
  fail-on:
    description: "Fail the workflow if findings at or above severity exist (critical | high | medium | low | none)"
    required: false
    default: "none"

outputs:
  total-findings:
    description: "Total Lemon Squeezy touchpoints discovered"
    value: ${{ steps.run-scan.outputs.total-findings }}
  critical-count:
    description: "Number of critical findings"
    value: ${{ steps.run-scan.outputs.critical-count }}
  estimated-hours:
    description: "Estimated migration engineering hours"
    value: ${{ steps.run-scan.outputs.estimated-hours }}
  estimated-tier:
    description: "Estimated complexity tier (Clean | Simple | Standard | Complex)"
    value: ${{ steps.run-scan.outputs.estimated-tier }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Build ls-exit if needed
      if: ${{ !hashFiles(format('{0}/dist/src/cli.js', github.action_path)) }}
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        npm install --no-audit --no-fund
        npm run build

    - name: Run ls-exit scanner
      id: run-scan
      shell: bash
      run: |
        node "${{ github.action_path }}/dist/src/cli.js" scan "${{ inputs.path }}" \
          --target "${{ inputs.target }}" \
          --format "${{ inputs.format }}" \
          --out "${{ inputs.out }}" \
          --fail-on "${{ inputs.fail-on }}" \
          --github-summary
